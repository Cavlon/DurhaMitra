<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The Durham Social Media Site">
    <meta name="author" content="Calvin Dantis">
    <title>DurhaMitra</title>

    <link rel="canonical" href="https://getbootstrap.com/docs/5.2/examples/offcanvas-navbar/">
    <link rel="shortcut icon" type="image/x-icon" href="./assets/images/favicon-32x32.png" />

    

    

<link href="./assets/css/bootstrap.min.css" rel="stylesheet">

    <style>
      .post-image {
        font-size: 3.5rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }

      .profile-image {
        font-size: 1rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }

      .b-example-divider {
        height: 3rem;
        background-color: rgba(0, 0, 0, .1);
        border: solid rgba(0, 0, 0, .15);
        border-width: 1px 0;
        box-shadow: inset 0 .5em 1.5em rgba(0, 0, 0, .1), inset 0 .125em .5em rgba(0, 0, 0, .15);
      }

      .b-example-vr {
        flex-shrink: 0;
        width: 1.5rem;
        height: 100vh;
      }

      .bi {
        vertical-align: -.125em;
        fill: currentColor;
      }

      .nav-scroller {
        position: relative;
        z-index: 2;
        height: 2.75rem;
        overflow-y: hidden;
      }

      .nav-scroller .nav {
        display: flex;
        flex-wrap: nowrap;
        padding-bottom: 1rem;
        margin-top: -1px;
        overflow-x: auto;
        text-align: center;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
      }
    </style>

    
    <!-- Custom styles for this template -->
    <link href="./assets/css/style.css" rel="stylesheet">
  </head>
  <body class="bg-dark">
    
<nav class="navbar navbar-dark bg-grey" aria-label="Dark offcanvas navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Durha<span class="text-purple">Mitra</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbarDark" aria-controls="offcanvasNavbarDark">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasNavbarDark" aria-labelledby="offcanvasNavbarDarkLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasNavbarDarkLabel">Make a Post</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <div class="navbar-nav justify-content-end flex-grow-1 pe-3">
            <h6 class="error" id="postError"></h6>
            <form method="post" id="createPost" class="form" enctype="multipart/form-data">
              <input class="form-control me-2" type="text" name="name" placeholder="Name" aria-label="Name"><br>
              <select class="form-control me-2" name="college">
                <option value="collingwood">Collingwood College</option>
                <option value="grey">Grey College</option>
                <option value="hatfield">Hatfield College</option>
                <option value="john-snow">John Snow College</option>
                <option value="josephine-butler">Josephine Butler College</option>
                <option value="south">South College</option>
                <option value="aidens">St Aidan's College</option>
                <option value="chads">St Chad's College</option>
                <option value="cuthberts">St Cuthbert's Society</option>
                <option value="hild-bede">College of St Hild & St Bede</option>
                <option value="johns">St John's College</option>
                <option value="marys">St Mary's College</option>
                <option value="stephenson">Stephenson College</option>
                <option value="trevelyan">Trevelyan College</option>
                <option value="university">University College</option>
                <option value="van-mildert">Van Mildert College</option>
                <option value="ustinov">Ustinov College</option>
              </select><br>
              <textarea class="form-control" name="postText" rows="2" style="background: #fff;" placeholder="Post Text"></textarea><br>
              <input type="file" name="imageUpload" id="imageUpload" accept="image/png, image/gif, image/jpeg" onchange="displayImages(event)" style="display: none;" multiple>
              <label class="highlight" for="imageUpload" style="cursor: pointer;"><strong>Upload Images</strong></label><br>
              <input style="margin-top: 20px;" class="submit" type="submit" value="Submit">
              <div id="uploadedImages">

              </div>
            </form>          
          </div>
        </div>
      </div>
    </div>
  </nav>

<div class="navbar navbar-expand bg-body shadow-sm">
  <div class="container-fluid">
    <div class="navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0" style="padding: 0px;">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page">
            <button type="button" id="allPostsBtn" class="highlight" style=" border: 0px; margin: 0px; padding: 0px; background-color: transparent;">All Posts</button> <span class="badge text-bg-light rounded-pill align-text-bottom" id="allPosts">0</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link">
            Visible Posts <span class="badge text-bg-light rounded-pill align-text-bottom" id="visiblePosts">0</span>
          </a>
        </li>
      </ul>
      <h6 class="error" style="padding-top: 5px; padding-right: 10px;" id="displayError"></h6>
      <form class="d-flex" id="searchBar">
        <input class="form-control me-2" type="text" name="search" placeholder="Search" aria-label="Search" style="height: 30px;">
        <button class="btn btn-outline-success btn-sm" type="submit">Search</button>
      </form>
    </div>
  </div>
</div>

<main class="container">
  <div class="d-flex align-items-center p-3 my-3 text-white bg-purple rounded shadow-sm">
    <img src="./assets/images/DurhamLogoWhite.png" width="40" height="40" alt="">
    <div class="lh-1" style="padding-left: 5px;">
      <h1 class="h6 mb-0 text-white lh-1">DurhaMitra</h1>
      <small>Share your Durham experiences! Share events, notes, adverts or just share how life at Durham is going!</small>
    </div>
  </div>

  <div class="my-3 p-3 bg-body rounded shadow-sm">
    <h6 class="border-bottom pb-2 mb-0">Posts</h6>

    <div id="posts">

    </div>
  </div>
</main>


    <script src="./assets/js/bootstrap.bundle.min.js"></script>

    <script src="./assets/js/client.js"></script>
  </body>
</html>
